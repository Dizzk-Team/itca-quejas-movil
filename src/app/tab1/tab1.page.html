<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Peliculas Populares</ion-title>
    </ion-toolbar>
  </ion-header>
<ion-list>
  <ion-item *ngFor="let estudiante of estudiante()">
    <label>
        <h2>{{ estudiante.nombre }}</h2>
        <p>{{ estudiante.apellido }}</p>
        <p>{{ estudiante.carnet }}</p>
        </label>
  </ion-item>
</ion-list>
</ion-content>
